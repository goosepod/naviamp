org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official
android.useAndroidX=true
android.r8.optimizedResourceShrinking=true
# Keep lint's Kotlin analyzer compatible without changing the AGP host.
android.experimental.lint.version=9.5.1
kotlin.mpp.enableCInteropCommonization=true
# Preserve the existing PMCS runtime policy across the compiler upgrade (2.4 defaults to CMS).
kotlin.native.binary.gc=pmcs
