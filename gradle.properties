org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official
android.useAndroidX=true
android.r8.optimizedResourceShrinking=true
kotlin.mpp.enableCInteropCommonization=true
# Preserve the existing PMCS runtime policy across the compiler upgrade (2.4 defaults to CMS).
kotlin.native.binary.gc=pmcs
# Retry transient repository failures (timeouts, 5xx, 429) longer before failing a build.
systemProp.org.gradle.internal.repository.max.retries=5
systemProp.org.gradle.internal.repository.initial.backoff=2000
