name: Release Corretto 21
description: Install and verify the pinned Windows or Linux x64 release JDK.
runs:
  using: composite
  steps:
    - name: Install pinned Corretto 21 on Windows
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        $name = 'amazon-corretto-21.0.13.1.2-windows-x64-jdk.zip'
        $archive = Join-Path $env:RUNNER_TEMP $name
        $jdk = Join-Path $env:RUNNER_TEMP 'naviamp-corretto'
        curl.exe --fail --location --retry 3 --silent --show-error "https://corretto.aws/downloads/resources/21.0.13.1.2/$name" -o $archive
        if ($LASTEXITCODE -ne 0) { throw 'Corretto download failed.' }
        if ((Get-FileHash -Algorithm SHA256 $archive).Hash -ne 'e91d8d38fe7af1e13ddde5c65d6c0cdd62d68fe091e9003464f5b45c422fb683') {
          throw 'Corretto archive SHA-256 mismatch.'
        }
        New-Item -ItemType Directory $jdk | Out-Null
        tar.exe -xf $archive -C $jdk --strip-components=1
        if ($LASTEXITCODE -ne 0) { throw 'Corretto extraction failed.' }
        "JAVA_HOME=$jdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        (Join-Path $jdk 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Install pinned Corretto 21 on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        name=amazon-corretto-21.0.13.1.2-linux-x64.tar.gz
        archive="$RUNNER_TEMP/$name"
        jdk="$RUNNER_TEMP/naviamp-corretto"
        curl --fail --location --retry 3 --silent --show-error "https://corretto.aws/downloads/resources/21.0.13.1.2/$name" -o "$archive"
        printf '%s  %s\n' 2aaa2a9a43143b20ff0b28c8d0da27407b97dc40b160d9a2f60a26965815e948 "$archive" | sha256sum --check
        mkdir "$jdk"
        tar -xzf "$archive" -C "$jdk" --strip-components=1
        printf 'JAVA_HOME=%s\n' "$jdk" >> "$GITHUB_ENV"
        printf '%s/bin\n' "$jdk" >> "$GITHUB_PATH"
