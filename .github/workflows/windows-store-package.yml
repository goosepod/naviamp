name: Windows Store package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-store-package.yml'
      - 'apps/desktop/packaging/windows-store/**'
      - 'scripts/build-windows-store.ps1'
      - 'scripts/windows-store-package.py'
      - 'scripts/tests/test_windows_store_package.py'

permissions:
  contents: read

jobs:
  package:
    name: Wrap released Windows v2.9.0
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test release and package verification
        run: python -m unittest discover -s scripts/tests -p test_windows_store_package.py -v
      - name: Build MSIX from the pinned public release
        shell: pwsh
        run: ./scripts/build-windows-store.ps1
      - name: Retain Store package and provenance
        uses: actions/upload-artifact@v7
        with:
          name: windows-store-v2.9.0
          if-no-files-found: error
          path: |
            build/windows-store/*.msix
            build/windows-store/provenance.json
            build/windows-store/SHA256SUMS
            build/windows-store/makeappx.log
