name: Verify

on:
  workflow_call:
    inputs:
      source_ref:
        description: Source ref to verify when rebuilding an existing release tag
        type: string
        required: false
        default: ''
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g
  TZ: America/Los_Angeles

jobs:
  changes:
    name: Classify verification scope
    runs-on: ubuntu-latest
    outputs:
      run_full: ${{ steps.classify.outputs.run_full }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run_full=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            run_full=false
            while IFS= read -r path; do
              case "$path" in
                *.md|docs/*|readme-assets/*) ;;
                *) run_full=true; break ;;
              esac
            done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          fi
          echo "run_full=$run_full" >> "$GITHUB_OUTPUT"

  shared-android:
    name: Shared and Android tests
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful change classification
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          fetch-depth: 0

      - name: Validate documentation-only changes
        if: needs.changes.outputs.run_full == 'false'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA"

      - name: Set up JDK
        if: needs.changes.outputs.run_full == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: needs.changes.outputs.run_full == 'true'
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android build packages
        if: needs.changes.outputs.run_full == 'true'
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Run shared and Android unit tests
        if: needs.changes.outputs.run_full == 'true'
        run: >
          ./gradlew
          -Pkotlin.native.enableKlibsCrossCompilation=false
          verifyCoreFirstArchitecture
          jvmTest
          :apps:android:testDebugUnitTest
          :apps:android:testReleaseUnitTest
          :apps:android:verifyDebugBassNativePackage
          :apps:android:bundleDebug

      - name: Configure headless ALSA output for coverage aggregation
        if: needs.changes.outputs.run_full == 'true'
        run: |
          printf '%s\n' 'pcm.!default { type null }' > "$RUNNER_TEMP/naviamp-asound.conf"
          echo "ALSA_CONFIG_PATH=$RUNNER_TEMP/naviamp-asound.conf" >> "$GITHUB_ENV"

      - name: Verify and publish JVM coverage reports
        if: needs.changes.outputs.run_full == 'true'
        run: ./gradlew -Pkotlin.native.enableKlibsCrossCompilation=false :koverVerify :koverHtmlReport :koverXmlReport

      - name: Upload test and coverage reports
        if: always() && needs.changes.result == 'success' && needs.changes.outputs.run_full == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: shared-android-test-reports
          if-no-files-found: warn
          path: |
            **/build/reports/tests/**
            build/reports/kover/**

  desktop-macos:
    name: Desktop native tests (macOS)
    needs: changes
    if: needs.changes.outputs.run_full == 'true'
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Run Desktop tests with macOS native libraries
        run: ./gradlew -Pnaviamp.bass.platform=macos-arm64 -Pcompose.desktop.packaging.checkJdkVendor=false desktopTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-macos-test-reports
          if-no-files-found: error
          path: "**/build/reports/tests/desktopTest/**"

  android-device:
    name: Android emulator native tests
    needs: changes
    if: needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Create test emulator
        run: |
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.0.12077973" "emulator" "system-images;android-35;google_apis;x86_64"
          echo no | avdmanager create avd --force --name naviamp-ci --package "system-images;android-35;google_apis;x86_64"

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start emulator
        run: |
          "$ANDROID_HOME/emulator/emulator" -avd naviamp-ci -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect >/tmp/naviamp-emulator.log 2>&1 &
          emulator_pid=$!
          booted=false
          for _ in $(seq 1 120); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo "Android emulator exited before completing boot."
              cat /tmp/naviamp-emulator.log
              exit 1
            fi
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              booted=true
              break
            fi
            sleep 2
          done
          if [ "$booted" != true ]; then
            echo "Android emulator did not complete boot within four minutes."
            cat /tmp/naviamp-emulator.log
            exit 1
          fi
          adb shell input keyevent 82

      - name: Exercise Android Keystore and packaged BASS libraries
        run: ./gradlew -Pkotlin.native.enableKlibsCrossCompilation=false :apps:android:connectedDebugAndroidTest

      - name: Upload device reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-device-test-reports
          if-no-files-found: error
          path: |
            apps/android/build/reports/androidTests/**
            apps/android/build/outputs/androidTest-results/**
            /tmp/naviamp-emulator.log

  desktop-windows:
    name: Desktop native tests (Windows)
    needs: changes
    if: needs.changes.outputs.run_full == 'true'
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Run Desktop tests with Windows native libraries
        shell: powershell
        run: .\gradlew.bat "-Pkotlin.native.enableKlibsCrossCompilation=false" "-Pnaviamp.bass.platform=windows-x64" "-Pnaviamp.bass.test.outputDevice=0" desktopTest

      - name: Verify packaged Windows idle CPU
        shell: powershell
        run: .\scripts\windows-idle-cpu.ps1

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-windows-test-reports
          if-no-files-found: error
          path: "**/build/reports/tests/desktopTest/**"

  desktop-linux:
    name: Desktop native tests (Linux)
    needs: changes
    if: needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libsecret-tools

      - name: Configure headless ALSA output
        run: |
          printf '%s\n' 'pcm.!default { type null }' > "$RUNNER_TEMP/naviamp-asound.conf"
          echo "ALSA_CONFIG_PATH=$RUNNER_TEMP/naviamp-asound.conf" >> "$GITHUB_ENV"

      - name: Run Desktop tests with Linux native libraries
        run: ./gradlew -Pkotlin.native.enableKlibsCrossCompilation=false -Pnaviamp.bass.platform=linux-x64 desktopTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-linux-test-reports
          if-no-files-found: error
          path: "**/build/reports/tests/desktopTest/**"

  ios:
    name: iOS simulator tests
    needs: changes
    if: needs.changes.outputs.run_full == 'true'
    runs-on: macos-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache and reporting
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Set up Android SDK for Gradle configuration
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Compile device target and run all simulator tests
        run: |
          mkdir -p build/ci-timings
          started_at="$(date +%s)"
          ./gradlew \
            --parallel \
            --max-workers=2 \
            --profile \
            verifyCoreFirstArchitecture \
            iosSimulatorArm64Test \
            :apps:ios:compileKotlinIosArm64
          elapsed_seconds="$(($(date +%s) - started_at))"
          printf 'stage\tseconds\nGradle simulator tests and device compile\t%s\n' \
            "$elapsed_seconds" > build/ci-timings/ios.tsv
          {
            echo '### iOS verification timing'
            echo '| Stage | Duration |'
            echo '| --- | ---: |'
            echo "| Gradle simulator tests and device compile | ${elapsed_seconds}s |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build the production iOS app
        run: |
          started_at="$(date +%s)"
          destination_id="$(xcodebuild -project apps/ios/Naviamp.xcodeproj -scheme Naviamp -showdestinations | awk -F'id:' '/platform:iOS Simulator/ && /name:iPhone/ { split($2, fields, ","); gsub(/[[:space:]]/, "", fields[1]); print fields[1]; exit }')"
          test -n "$destination_id"
          xcodebuild build -quiet \
            -showBuildTimingSummary \
            -project apps/ios/Naviamp.xcodeproj \
            -scheme Naviamp \
            -configuration Debug \
            -destination "id=$destination_id"
          elapsed_seconds="$(($(date +%s) - started_at))"
          printf 'Xcode production app build\t%s\n' "$elapsed_seconds" >> build/ci-timings/ios.tsv
          echo "| Xcode production app build | ${elapsed_seconds}s |" >> "$GITHUB_STEP_SUMMARY"

      - name: Exercise the Apple Keychain boundary
        run: |
          started_at="$(date +%s)"
          destination_id="$(xcodebuild -project apps/ios/Naviamp.xcodeproj -scheme NaviampTests -showdestinations | awk -F'id:' '/platform:iOS Simulator/ && /name:iPhone/ { split($2, fields, ","); gsub(/[[:space:]]/, "", fields[1]); print fields[1]; exit }')"
          test -n "$destination_id"
          xcodebuild test -quiet \
            -showBuildTimingSummary \
            -project apps/ios/Naviamp.xcodeproj \
            -scheme NaviampTests \
            -configuration Debug \
            -destination "id=$destination_id" \
            -resultBundlePath build/ios-keychain-tests.xcresult
          elapsed_seconds="$(($(date +%s) - started_at))"
          printf 'Keychain boundary test\t%s\n' "$elapsed_seconds" >> build/ci-timings/ios.tsv
          echo "| Keychain boundary test | ${elapsed_seconds}s |" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-reports
          if-no-files-found: error
          path: |
            **/build/reports/tests/iosSimulatorArm64Test/**
            build/reports/profile/**
            build/ci-timings/ios.tsv
            build/ios-keychain-tests.xcresult

  evidence:
    name: Record verified source tree
    needs:
      - changes
      - shared-android
      - desktop-macos
      - android-device
      - desktop-windows
      - desktop-linux
      - ios
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      needs.changes.outputs.run_full == 'true' &&
      needs.shared-android.result == 'success' &&
      needs.desktop-macos.result == 'success' &&
      needs.android-device.result == 'success' &&
      needs.desktop-windows.result == 'success' &&
      needs.desktop-linux.result == 'success' &&
      needs.ios.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the verified pull-request merge
        uses: actions/checkout@v7

      - name: Write verification evidence
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/naviamp-verification"
          {
            echo "source_head_sha=$SOURCE_HEAD_SHA"
            echo "tested_commit_sha=$(git rev-parse HEAD)"
            echo "tested_tree_sha=$(git rev-parse 'HEAD^{tree}')"
            echo "workflow_run_id=$WORKFLOW_RUN_ID"
          } > "$RUNNER_TEMP/naviamp-verification/evidence.txt"

      - name: Upload verification evidence
        uses: actions/upload-artifact@v7
        with:
          name: verified-source-${{ github.event.pull_request.head.sha }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/naviamp-verification/evidence.txt
