name: Tag release builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild with this workflow (blank builds the selected branch only)
        type: string
        required: false
        default: ''

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: release-${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
  cancel-in-progress: true

env:
  NAVIAMP_RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g
  TZ: America/Los_Angeles

jobs:
  reusable-verification:
    name: Find reusable verification
    runs-on: ubuntu-latest
    outputs:
      reuse_verified: ${{ steps.find.outputs.reuse_verified }}
      evidence: ${{ steps.find.outputs.evidence }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          fetch-depth: 0

      - name: Find successful verification for this source tree
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target_sha="$(git rev-parse HEAD)"
          target_tree="$(git rev-parse 'HEAD^{tree}')"
          candidate_file="$RUNNER_TEMP/verification-candidates"
          printf '%s\n' "$target_sha" > "$candidate_file"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${target_sha}/pulls" \
            --jq '.[].head.sha' >> "$candidate_file"

          reuse_verified=false
          evidence="No successful full verification artifact matched tree ${target_tree}."
          while IFS= read -r candidate_sha; do
            test -n "$candidate_sha" || continue
            artifact_data="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/artifacts" \
              -f name="verified-source-${candidate_sha}" \
              --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | first | if . then [.id, .workflow_run.id] | @tsv else empty end')"
            test -n "$artifact_data" || continue
            artifact_id="${artifact_data%%$'\t'*}"
            run_id="${artifact_data#*$'\t'}"
            run_data="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
              --jq '[.name, .event, .conclusion, .head_sha] | @tsv')"
            expected_run_data="Verify"$'\t'"pull_request"$'\t'"success"$'\t'"${candidate_sha}"
            test "$run_data" = "$expected_run_data" || continue

            evidence_dir="$RUNNER_TEMP/verification-${artifact_id}"
            mkdir -p "$evidence_dir"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$evidence_dir/evidence.zip"
            unzip -q "$evidence_dir/evidence.zip" -d "$evidence_dir"
            evidence_file="$evidence_dir/evidence.txt"
            test -f "$evidence_file" || continue
            recorded_head="$(sed -n 's/^source_head_sha=//p' "$evidence_file")"
            recorded_tree="$(sed -n 's/^tested_tree_sha=//p' "$evidence_file")"
            recorded_run="$(sed -n 's/^workflow_run_id=//p' "$evidence_file")"
            if [ "$recorded_head" = "$candidate_sha" ] && \
               [ "$recorded_tree" = "$target_tree" ] && \
               [ "$recorded_run" = "$run_id" ]; then
              reuse_verified=true
              evidence="Reusing successful Verify run ${run_id} for source tree ${target_tree}."
              break
            fi
          done < <(awk '!seen[$0]++' "$candidate_file")

          echo "reuse_verified=$reuse_verified" >> "$GITHUB_OUTPUT"
          echo "evidence=$evidence" >> "$GITHUB_OUTPUT"
          echo "$evidence"

  verification:
    name: Verification fallback
    needs: reusable-verification
    if: needs.reusable-verification.outputs.reuse_verified != 'true'
    uses: ./.github/workflows/verify.yml
    with:
      source_ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

  verification-gate:
    name: Verification gate
    needs:
      - reusable-verification
      - verification
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require reused or fresh verification
        env:
          EVIDENCE: ${{ needs.reusable-verification.outputs.evidence }}
          REUSE_VERIFIED: ${{ needs.reusable-verification.outputs.reuse_verified }}
          REUSE_RESULT: ${{ needs.reusable-verification.result }}
          VERIFICATION_RESULT: ${{ needs.verification.result }}
        run: |
          echo "$EVIDENCE"
          test "$REUSE_RESULT" = "success"
          if [ "$REUSE_VERIFIED" = "true" ]; then
            test "$VERIFICATION_RESULT" = "skipped"
          else
            test "$VERIFICATION_RESULT" = "success"
          fi

  version:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Validate version files
        run: scripts/validate-version.sh

      - name: Validate tag matches VERSION
        if: env.NAVIAMP_RELEASE_TAG != ''
        run: scripts/validate-release-tag.sh "$NAVIAMP_RELEASE_TAG"

  android:
    name: Android signed APK and App Bundle
    needs:
      - version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android build packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Restore Android signing key
        env:
          NAVIAMP_ANDROID_KEYSTORE_BASE64: ${{ secrets.NAVIAMP_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$NAVIAMP_ANDROID_KEYSTORE_BASE64"
          mkdir -p "$RUNNER_TEMP/naviamp-signing"
          printf '%s' "$NAVIAMP_ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/naviamp-signing/naviamp-upload.jks"

      - name: Build unified signed Android release
        env:
          NAVIAMP_ANDROID_KEYSTORE: ${{ runner.temp }}/naviamp-signing/naviamp-upload.jks
          NAVIAMP_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.NAVIAMP_ANDROID_KEYSTORE_PASSWORD }}
          NAVIAMP_ANDROID_KEY_ALIAS: ${{ secrets.NAVIAMP_ANDROID_KEY_ALIAS }}
          NAVIAMP_ANDROID_KEY_PASSWORD: ${{ secrets.NAVIAMP_ANDROID_KEY_PASSWORD }}
        run: |
          scripts/require-android-signing.sh
          ./gradlew -Pkotlin.native.enableKlibsCrossCompilation=false :apps:android:stageReleaseArtifacts

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: naviamp-android
          if-no-files-found: error
          path: |
            apps/android/build/release-artifacts/*.apk
            apps/android/build/release-artifacts/*.aab
            apps/android/build/release-artifacts/*-mapping.txt
            apps/android/build/release-artifacts/*-native-debug-symbols.zip

  windows:
    name: Windows zip and installers
    needs:
      - version
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install WiX Toolset
        shell: powershell
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --version=3.14.1 --no-progress -y
            "$env:ProgramFiles(x86)\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          }

      - name: Build Windows standalone zip and installers
        shell: powershell
        env:
          CMAKE_EXE: cmake
        run: .\gradlew.bat "-Pkotlin.native.enableKlibsCrossCompilation=false" "-Pnaviamp.bass.platform=windows-x64" :apps:desktop:stageReleaseArtifacts

      - name: List Windows release outputs
        shell: powershell
        run: |
          Get-ChildItem apps/desktop/build/release-artifacts

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: naviamp-windows
          if-no-files-found: error
          path: |
            apps/desktop/build/release-artifacts/*

  macos:
    name: macOS zip and DMG
    needs:
      - version
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Build macOS standalone zip and DMG
        run: ./gradlew -Pnaviamp.bass.platform=macos-arm64 -Pcompose.desktop.packaging.checkJdkVendor=false :apps:desktop:stageReleaseArtifacts

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: naviamp-macos
          if-no-files-found: error
          path: |
            apps/desktop/build/release-artifacts/*

  linux:
    name: Linux zip, DEB, and RPM
    needs:
      - version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Linux packaging and secure-storage tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm libsecret-tools

      - name: Build Linux standalone zip and installers
        run: ./gradlew -Pkotlin.native.enableKlibsCrossCompilation=false -Pnaviamp.bass.platform=linux-x64 :apps:desktop:stageReleaseArtifacts

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: naviamp-linux
          if-no-files-found: error
          path: |
            apps/desktop/build/release-artifacts/*

  ios-unsigned:
    name: iOS unsigned device IPA
    needs:
      - version
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Build unsigned iOS device IPA
        run: scripts/build-ios-unsigned-ipa.sh

      - name: Upload unsigned iOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: naviamp-ios-unsigned
          if-no-files-found: error
          path: build/ios-unsigned/distributions/*

  github-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs:
      - verification-gate
      - android
      - windows
      - macos
      - linux
      - ios-unsigned
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Prepare release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_notes_file=".github/releases/${NAVIAMP_RELEASE_TAG}.md"
          if [ -f "$release_notes_file" ]; then
            cp "$release_notes_file" "$RUNNER_TEMP/release-notes.md"
          else
            if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$NAVIAMP_RELEASE_TAG" \
              --jq .body > "$RUNNER_TEMP/release-notes.md"; then
              : > "$RUNNER_TEMP/release-notes.md"
            fi
          fi

          if [ ! -s "$RUNNER_TEMP/release-notes.md" ] && [ -f CHANGELOG.md ]; then
            awk -v tag="${NAVIAMP_RELEASE_TAG}" '
              $0 == "## " tag { release = 1; public = 1; print; print ""; next }
              release && /^## / { exit }
              release && $0 == "### Features" { public = 1; print; next }
              release && $0 ~ /^### (Highlights|Improvements|Bug [Ff]ixes|Upgrade [Nn]otes|Known [Ii]ssues)$/ { public = 1; print; next }
              release && $0 ~ /^### (Alpha Notes|Beta Notes|Release Candidate Notes|Release Notes) and Known Limitations$/ { public = 1; print; next }
              release && /^### / { public = 0; next }
              release && public { print }
            ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          fi

          if [ -s "$RUNNER_TEMP/release-notes.md" ]; then
            :
          else
            {
              echo "Naviamp ${NAVIAMP_RELEASE_TAG}"
              echo
              echo "Release notes are unavailable. See CHANGELOG.md and the tagged commit for details."
            } > "$RUNNER_TEMP/release-notes.md"
          fi

      - name: Download built artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: naviamp-*
          path: release-artifacts
          merge-multiple: true

      - name: List release assets
        run: find release-artifacts -type f -print | sort

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.NAVIAMP_RELEASE_TAG }}
          name: Naviamp ${{ env.NAVIAMP_RELEASE_TAG }}
          draft: true
          body_path: ${{ runner.temp }}/release-notes.md
          fail_on_unmatched_files: true
          files: release-artifacts/**
