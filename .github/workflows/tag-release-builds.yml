name: Tag release builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g
  TZ: America/Los_Angeles

jobs:
  version:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate version files
        run: scripts/validate-version.sh

      - name: Validate tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/validate-release-tag.sh "$GITHUB_REF_NAME"

  android:
    name: Android signed APK
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Restore Android signing key
        env:
          NAVIAMP_ANDROID_KEYSTORE_BASE64: ${{ secrets.NAVIAMP_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$NAVIAMP_ANDROID_KEYSTORE_BASE64"
          mkdir -p "$RUNNER_TEMP/naviamp-signing"
          printf '%s' "$NAVIAMP_ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/naviamp-signing/naviamp-upload.jks"

      - name: Build signed Android release APK
        env:
          NAVIAMP_ANDROID_KEYSTORE: ${{ runner.temp }}/naviamp-signing/naviamp-upload.jks
          NAVIAMP_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.NAVIAMP_ANDROID_KEYSTORE_PASSWORD }}
          NAVIAMP_ANDROID_KEY_ALIAS: ${{ secrets.NAVIAMP_ANDROID_KEY_ALIAS }}
          NAVIAMP_ANDROID_KEY_PASSWORD: ${{ secrets.NAVIAMP_ANDROID_KEY_PASSWORD }}
        run: |
          scripts/require-android-signing.sh
          ./gradlew :apps:android:stageReleaseApk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: naviamp-android-apk
          if-no-files-found: error
          path: apps/android/build/release-artifacts/*.apk

  windows:
    name: Windows zip and installers
    needs: version
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install WiX Toolset
        shell: powershell
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --version=3.14.1 --no-progress -y
            "$env:ProgramFiles(x86)\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          }

      - name: Build Windows standalone zip and installers
        shell: powershell
        env:
          CMAKE_EXE: cmake
        run: .\gradlew.bat "-Pnaviamp.bass.platform=windows-x64" :apps:desktop:stageReleaseArtifacts

      - name: List Windows release outputs
        shell: powershell
        run: |
          Get-ChildItem apps/desktop/build/release-artifacts

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: naviamp-windows
          if-no-files-found: error
          path: |
            apps/desktop/build/release-artifacts/*

  macos:
    name: macOS zip and DMG
    needs: version
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build macOS standalone zip and DMG
        run: ./gradlew -Pnaviamp.bass.platform=macos-arm64 -Pcompose.desktop.packaging.checkJdkVendor=false :apps:desktop:stageReleaseArtifacts

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: naviamp-macos
          if-no-files-found: error
          path: |
            apps/desktop/build/release-artifacts/*

  linux:
    name: Linux zip, DEB, and RPM
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Linux packaging and secure-storage tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm libsecret-tools

      - name: Build Linux standalone zip and installers
        run: ./gradlew -Pnaviamp.bass.platform=linux-x64 :apps:desktop:stageReleaseArtifacts

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: naviamp-linux
          if-no-files-found: error
          path: |
            apps/desktop/build/release-artifacts/*

  ios-unsigned:
    name: iOS unsigned device IPA
    needs: version
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build unsigned iOS device IPA
        run: scripts/build-ios-unsigned-ipa.sh

      - name: Upload unsigned iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: naviamp-ios-unsigned
          if-no-files-found: error
          path: build/ios-unsigned/distributions/*

  github-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - android
      - windows
      - macos
      - linux
      - ios-unsigned
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare release notes
        run: |
          if [ -f CHANGELOG.md ]; then
            awk -v tag="${GITHUB_REF_NAME}" '
              $0 == "## " tag { release = 1; public = 1; print; print ""; next }
              release && /^## / { exit }
              release && $0 == "### Features" { public = 1; print; next }
              release && $0 == "### Bug Fixes" { public = 1; print; next }
              release && $0 ~ /^### (Alpha|Beta|Release Candidate) Notes and Known Limitations$/ { public = 1; print; next }
              release && /^### / { public = 0; next }
              release && public { print }
            ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          fi

          if [ -s "$RUNNER_TEMP/release-notes.md" ]; then
            :
          else
            {
              echo "Naviamp ${GITHUB_REF_NAME}"
              echo
              echo "See CHANGELOG.md and the tagged commit for release details."
            } > "$RUNNER_TEMP/release-notes.md"
          fi

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List release assets
        run: find release-artifacts -type f -print | sort

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Naviamp ${{ github.ref_name }}
          draft: true
          body_path: ${{ runner.temp }}/release-notes.md
          fail_on_unmatched_files: true
          files: release-artifacts/**
