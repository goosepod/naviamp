<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Naviamp Amp Dial icon concept</title>
  <desc id="desc">A modern blue amplifier dial with a segmented signal crown and an angular N-shaped needle.</desc>
  <defs>
    <linearGradient id="bg" x1="128" y1="88" x2="888" y2="936" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B2C5B"/>
      <stop offset="1" stop-color="#030A14"/>
    </linearGradient>
    <linearGradient id="ring" x1="260" y1="216" x2="776" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4CE3FF"/>
      <stop offset="0.52" stop-color="#087CFF"/>
      <stop offset="1" stop-color="#4B56FF"/>
    </linearGradient>
    <radialGradient id="dial" cx="0" cy="0" r="1" gradientTransform="translate(430 400) rotate(48) scale(350)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#214C83"/>
      <stop offset="1" stop-color="#07162B"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <path d="M253 739A356 356 0 1 1 771 739" fill="none" stroke="url(#ring)" stroke-width="76" stroke-linecap="round" filter="url(#glow)"/>
  <g stroke="#B7EEFF" stroke-width="20" stroke-linecap="round">
    <path d="M268 278L299 310"/>
    <path d="M414 201L426 244"/>
    <path d="M598 201L586 244"/>
    <path d="M756 278L725 310"/>
  </g>
  <circle cx="512" cy="548" r="244" fill="url(#dial)" stroke="#4DCFFF" stroke-opacity="0.35" stroke-width="8"/>
  <path d="M380 656V440L644 656V440" fill="none" stroke="#EAFBFF" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="512" cy="548" r="34" fill="#0C73F6" stroke="#BCEEFF" stroke-width="12"/>
</svg>
