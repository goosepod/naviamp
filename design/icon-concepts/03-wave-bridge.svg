<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Naviamp Wave Bridge icon concept</title>
  <desc id="desc">A dark rounded icon crossed by a luminous blue waveform that rises into a bridge-shaped music signal.</desc>
  <defs>
    <linearGradient id="bg" x1="512" y1="0" x2="512" y2="1024" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07162A"/>
      <stop offset="1" stop-color="#020811"/>
    </linearGradient>
    <linearGradient id="wave" x1="130" y1="680" x2="894" y2="326" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4FE7FF"/>
      <stop offset="0.5" stop-color="#087CFF"/>
      <stop offset="1" stop-color="#5161FF"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-50%" width="150%" height="200%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <g opacity="0.25" fill="#209DFF">
    <rect x="156" y="464" width="18" height="96" rx="9"/>
    <rect x="196" y="424" width="18" height="176" rx="9"/>
    <rect x="236" y="474" width="18" height="76" rx="9"/>
    <rect x="770" y="474" width="18" height="76" rx="9"/>
    <rect x="810" y="424" width="18" height="176" rx="9"/>
    <rect x="850" y="464" width="18" height="96" rx="9"/>
  </g>
  <path d="M132 610C230 610 238 364 354 364C468 364 462 660 574 660C688 660 694 414 892 414" fill="none" stroke="url(#wave)" stroke-width="112" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M126 770H898" stroke="#85DBFF" stroke-opacity="0.18" stroke-width="18" stroke-linecap="round"/>
  <g fill="#B7ECFF">
    <circle cx="132" cy="610" r="18"/>
    <circle cx="892" cy="414" r="18"/>
  </g>
</svg>
