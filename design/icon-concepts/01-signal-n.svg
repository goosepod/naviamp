<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Naviamp Signal N icon concept</title>
  <desc id="desc">A rounded midnight square with an original blue N monogram built from audio signal strokes.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="96" x2="884" y2="928" gradientUnits="userSpaceOnUse">
      <stop stop-color="#102C55"/>
      <stop offset="1" stop-color="#06111F"/>
    </linearGradient>
    <linearGradient id="signal" x1="260" y1="760" x2="780" y2="248" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20C7FF"/>
      <stop offset="0.52" stop-color="#0B72FF"/>
      <stop offset="1" stop-color="#3857FF"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="350" fill="none" stroke="#75DBFF" stroke-opacity="0.08" stroke-width="2"/>
  <g fill="none" stroke="url(#signal)" stroke-width="104" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M278 724V300"/>
    <path d="M746 724V300"/>
    <path d="M292 316C410 316 614 708 732 708"/>
  </g>
  <g fill="#BCEEFF">
    <rect x="172" y="442" width="24" height="140" rx="12"/>
    <rect x="132" y="476" width="24" height="72" rx="12" opacity="0.7"/>
    <rect x="828" y="442" width="24" height="140" rx="12"/>
    <rect x="868" y="476" width="24" height="72" rx="12" opacity="0.7"/>
  </g>
</svg>
