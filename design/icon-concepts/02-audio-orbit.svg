<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Naviamp Audio Orbit icon concept</title>
  <desc id="desc">A deep blue app icon with three orbital audio paths circling a bright four-point signal core.</desc>
  <defs>
    <radialGradient id="bg" cx="0" cy="0" r="1" gradientTransform="translate(390 330) rotate(49) scale(820)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#178BFF"/>
      <stop offset="0.48" stop-color="#0754D8"/>
      <stop offset="1" stop-color="#06215E"/>
    </radialGradient>
    <linearGradient id="orbit" x1="184" y1="264" x2="844" y2="790" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EAFBFF"/>
      <stop offset="1" stop-color="#58D7FF"/>
    </linearGradient>
    <filter id="coreGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <g fill="none" stroke="url(#orbit)" stroke-width="34" stroke-linecap="round">
    <ellipse cx="512" cy="512" rx="330" ry="142" transform="rotate(-18 512 512)" stroke-opacity="0.95"/>
    <ellipse cx="512" cy="512" rx="330" ry="142" transform="rotate(42 512 512)" stroke-opacity="0.72"/>
    <ellipse cx="512" cy="512" rx="330" ry="142" transform="rotate(102 512 512)" stroke-opacity="0.48"/>
  </g>
  <g fill="#EAFBFF">
    <circle cx="199" cy="589" r="28"/>
    <circle cx="758" cy="289" r="22"/>
    <circle cx="744" cy="761" r="18"/>
  </g>
  <g filter="url(#coreGlow)">
    <path d="M512 344C538 436 588 486 680 512C588 538 538 588 512 680C486 588 436 538 344 512C436 486 486 436 512 344Z" fill="#FFFFFF"/>
    <circle cx="512" cy="512" r="52" fill="#052D82"/>
  </g>
</svg>
