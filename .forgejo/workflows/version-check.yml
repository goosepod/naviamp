name: Version check

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  version:
    name: Version files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch main
        run: git fetch origin main

      - name: Validate version files
        run: scripts/validate-version.sh

      - name: Require version bump from main
        if: github.ref != 'refs/heads/feature/v2-cross-platform-app' && github.head_ref != 'feature/v2-cross-platform-app'
        run: scripts/check-version-bump.sh origin/main

  ios-domain:
    name: iOS core domain
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK for Gradle configuration
        uses: android-actions/setup-android@v3

      - name: Compile iOS device target and run simulator tests
        run: ./gradlew :core:domain:compileKotlinIosArm64 :core:domain:iosSimulatorArm64Test
